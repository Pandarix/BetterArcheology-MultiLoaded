# Builds both loaders on every push/PR. Also callable from publish.yml,
# so the build logic lives in exactly one place.
# This file is intended to be byte-identical on every version branch;
# the per-branch JDK lives in .java-version.
name: Build

on:
  push:
  pull_request:
  workflow_call:

concurrency:
  group: build-${{ github.ref }}-${{ github.event_name }}
  # supersede stale push builds; never cancel a build that belongs to a publish
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version-file: .java-version

      - uses: gradle/actions/setup-gradle@v6

      # setup-gradle only caches ~/.gradle; Loom's expensive per-checkout work
      # (minecraft merge/patch jars) lives in .gradle/loom-cache and would be
      # redone from scratch every run without this.
      - name: Cache Loom project cache
        uses: actions/cache@v4
        with:
          path: .gradle/loom-cache
          key: loom-${{ runner.os }}-${{ hashFiles('gradle.properties', 'build.gradle') }}
          restore-keys: loom-${{ runner.os }}-

      - name: Build (fabric + neoforge)
        run: ./gradlew build

      - name: Upload jars
        uses: actions/upload-artifact@v7
        with:
          name: jars
          path: |
            fabric/build/libs/*.jar
            neoforge/build/libs/*.jar
            !**/*-dev-shadow.jar
            !**/*-sources.jar
          if-no-files-found: error
