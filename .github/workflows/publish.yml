# Manual-only publishing to Modrinth + CurseForge (Actions tab -> Publish ->
# "Run workflow", or `gh workflow run publish.yml --ref <branch>`).
# Reuses build.yml for the build, then uploads after the environment gate.
# This file is intended to be byte-identical on every version branch;
# per-branch publish data lives in gradle.properties, the changelog in CHANGELOG.md.
name: Publish
run-name: "Publish ${{ github.ref_name }} (${{ inputs.release_type }})${{ inputs.dry_run && ' — dry run' || '' }}"

on:
  workflow_dispatch:
    inputs:
      changelog:
        description: "Changelog override. Empty = contents of CHANGELOG.md (recommended). The form is single-line, so use literal \\n for line breaks."
        required: false
        type: string
      display_name:
        description: "Upload title; [FABRIC]/[NEOFORGE] is appended per file. Empty = '<name> <mod_version> for <series>'"
        required: false
        type: string
      release_type:
        description: "Release channel"
        required: true
        type: choice
        default: release
        options:
          - release
          - beta
          - alpha
      dry_run:
        description: "Dry run: validate and stage everything, upload nothing"
        required: true
        type: boolean
        default: true

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # gate: requires approval per the 'publish' environment's protection rules
    environment: publish
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version-file: .java-version

      - uses: gradle/actions/setup-gradle@v6

      - name: Publish (dry_run=${{ inputs.dry_run }})
        run: ./gradlew publishMods
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          PUBLISH_CHANGELOG: ${{ inputs.changelog }}
          PUBLISH_DISPLAY_NAME: ${{ inputs.display_name }}
          PUBLISH_RELEASE_TYPE: ${{ inputs.release_type }}
          PUBLISH_DRY_RUN: ${{ inputs.dry_run }}

      - name: Upload dry-run staging output
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v7
        with:
          name: publish-dry-run
          path: "*/build/publishMods/**"
          if-no-files-found: warn
