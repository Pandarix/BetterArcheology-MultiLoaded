architectury {
    common rootProject.enabled_platforms.split(',')
}

sourceSets {
    main {
        java {
            exclude 'net/Pandarix/compat/rei/**'
        }
    }
}

loom {
    accessWidenerPath = project(":common").file("src/main/resources/betterarcheology.accessWidener")
    noIntermediateMappings()
}

// Workaround: architectury-plugin 3.4 calls getMappingConfiguration() on all loom projects,
// which throws in non-obfuscated environments. Disable the remap task and expose the plain jar.
afterEvaluate {
    ['transformProductionFabric', 'transformProductionNeoForge'].each { taskName ->
        def task = tasks.findByName(taskName)
        if (task) {
            task.enabled = false
            configurations.named(taskName).configure { cfg ->
                cfg.outgoing.artifacts.clear()
                cfg.outgoing.artifact(tasks.named('jar').flatMap { it.archiveFile }) {
                    builtBy(tasks.named('jar'))
                }
            }
        }
    }
}
dependencies {
    mappings loom.layered { }
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury:$rootProject.architectury_api_version"

    modImplementation "com.teamresourceful.resourcefulconfig:resourcefulconfig-common-${rootProject.resourceful_config_mc_version}:$rootProject.resourceful_config_version"
    //modImplementation "io.wispforest:accessories-common:${project.accessories_version}"

    modCompileOnlyApi("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    //modCompileOnly "me.shedaniel:RoughlyEnoughItems-api:${rei_version}"
}
