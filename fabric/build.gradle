plugins {
    id 'com.gradleup.shadow'
    id 'me.modmuss50.mod-publish-plugin'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

loom {
    runs {
        data {
            inherit client
            setConfigName("Fabric Data")
            ideConfigGenerated(true)

            vmArg("-Dfabric-api.datagen")
            vmArg("-Dfabric-api.datagen.output-dir=${project(":common").file("src/main/generated/resources")}")
            vmArg("-Dfabric-api.datagen.modid=betterarcheology")

            runDir "build/datagen"

        }
    }
}

sourceSets {
    main {
        resources {
            srcDir("src/main/generated/resources")
            srcDir(project(":common").file("src/main/generated/resources"))
            exclude("**/.cache")
        }
    }
}

repositories {
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        url "https://www.cursemaven.com"
    }
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/"
    }
    maven {
        name = "Ladysnake Libs"
        url = 'https://maven.ladysnake.org/releases'
    }
    maven {
        // location of the maven that hosts JEI files before January 2023
        name = "Progwml6's maven"
        url = "https://dvs1.progwml6.com/files/maven/"
    }
    maven {
        // location of the maven that hosts JEI files since January 2023
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        // location of a maven mirror for JEI files, as a fallback
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
    maven { url "https://maven.shedaniel.me" }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}
loom {
    accessWidenerPath = project(":common").file("src/main/resources/betterarcheology.accessWidener")
}
dependencies {
    implementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Fabric API. This is technically optional, but you probably want it anyway.
    implementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    implementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"

    common(project(path: ':common')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')

    //implementation("io.wispforest:accessories-fabric:${project.accessories_version}")
    //implementation "curse.maven:elytra-slot-317716:6677386"

    //CONFIG
    implementation "com.teamresourceful.resourcefulconfig:resourcefulconfig-fabric-${rootProject.resourceful_config_mc_version}:$rootProject.resourceful_config_version"

    // compile against the JEI API but do not include it at runtime
    compileOnly("mezz.jei:jei-${minecraft_version}-fabric-api:${jei_version}")
    // at runtime, use the full JEI jar for Fabric
    runtimeOnly("mezz.jei:jei-${minecraft_version}-fabric:${jei_version}")

    runtimeOnly "me.shedaniel:RoughlyEnoughItems-fabric:$rei_version"
}

processResources {
    var replaceProperties = [
            version: project.version, displayName: display_name, authors: authors, modDescription: mod_description
    ]
    inputs.properties replaceProperties

    filesMatching('fabric.mod.json') {
        expand replaceProperties
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

jar {
    from(zipTree(shadowJar.archiveFile))
    dependsOn shadowJar
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

publishMods {
    // Real upload only when CI explicitly sets PUBLISH_DRY_RUN=false;
    // every other invocation (local IDE/CLI included) is a rehearsal.
    dryRun = providers.environmentVariable("PUBLISH_DRY_RUN").getOrElse("true") != "false"

    // loom-no-remap: the plain jar is the final artifact (no remapJar on this branch)
    file = tasks.jar.archiveFile
    version = "${rootProject.publish_series}-${rootProject.mod_version}"
    changelog = providers.environmentVariable("PUBLISH_CHANGELOG").getOrElse("No changelog provided.")
    modLoaders.add("fabric")

    def channel = providers.environmentVariable("PUBLISH_RELEASE_TYPE").getOrElse("release")
    type = channel == "alpha" ? ALPHA : channel == "beta" ? BETA : STABLE

    def baseName = providers.environmentVariable("PUBLISH_DISPLAY_NAME")
            .map { it.isBlank() ? null : it }
            .getOrElse("${rootProject.display_name} ${rootProject.mod_version} for ${rootProject.publish_series}")
    displayName = "${baseName} [FABRIC]"

    def mcVersions = rootProject.supported_minecraft_versions.split(',')*.trim()

    modrinth {
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        projectId = rootProject.modrinth_id
        minecraftVersions.addAll(mcVersions)
        requires("architectury-api", "resourceful-config", "fabric-api")
    }

    curseforge {
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
        projectId = rootProject.curseforge_id
        minecraftVersions.addAll(mcVersions)
        clientRequired = true
        serverRequired = true
        requires("architectury-api", "resourceful-config", "fabric-api")
    }
}