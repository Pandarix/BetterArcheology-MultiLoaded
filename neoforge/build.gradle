plugins {
    id 'com.gradleup.shadow'
    id 'me.modmuss50.mod-publish-plugin'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}
loom {
}
repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    maven {
        url "https://www.cursemaven.com"
    }
    maven {
        // location of the maven that hosts JEI files since January 2023
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        // location of a maven mirror for JEI files, as a fallback
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
    maven {
        // Curios moved here after maven.octo-studios.com went offline
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    implementation "dev.architectury:architectury-neoforge:$rootProject.architectury_api_version"

    common(project(path: ':common')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')

    implementation "maven.modrinth:curios:${curios_version}+${minecraft_version}"
    //implementation("io.wispforest:accessories-neoforge:${project.accessories_version}")
    //implementation "curse.maven:elytra-slot-317716:6801976"
    //runtimeOnly "com.illusivesoulworks.caelus:caelus-neoforge:${caelus_version}+${minecraft_version}"
    //compileOnly "com.illusivesoulworks.caelus:caelus-neoforge:${caelus_version}+${minecraft_version}:api"

    // Config library
    implementation "com.teamresourceful.resourcefulconfig:resourcefulconfig-neoforge-${rootProject.resourceful_config_mc_version}:$rootProject.resourceful_config_version"

    compileOnly "mezz.jei:jei-$minecraft_version-common-api:$jei_version"
    compileOnly "mezz.jei:jei-$minecraft_version-neoforge-api:$jei_version"
    runtimeOnly("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")

    runtimeOnly "me.shedaniel:RoughlyEnoughItems-neoforge:$rei_version"

    // Hack fix for now, force jopt-simple to be exactly 5.0.4 because Mojang ships that version, but some transitive dependencies request 6.0+
    implementation('net.sf.jopt-simple:jopt-simple:5.0.4') { version { strictly '5.0.4' } }
}

sourceSets {
    main {
        resources {
            srcDir("src/main/generated/resources")
            srcDir(project(":common").file("src/main/generated/resources"))
            exclude("**/.cache")
        }
    }
}

processResources {
    var replaceProperties = [
            version    : project.version,
            displayName: display_name, authors: authors, modDescription: mod_description
    ]

    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

jar {
    from(zipTree(shadowJar.archiveFile))
    dependsOn shadowJar
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

publishMods {
    // Real upload only when CI explicitly sets PUBLISH_DRY_RUN=false;
    // every other invocation (local IDE/CLI included) is a rehearsal.
    dryRun = providers.environmentVariable("PUBLISH_DRY_RUN").getOrElse("true") != "false"

    // loom-no-remap: the plain jar is the final artifact (no remapJar on this branch)
    file = tasks.jar.archiveFile
    version = "${rootProject.publish_series}-${rootProject.mod_version}"
    changelog = providers.environmentVariable("PUBLISH_CHANGELOG").getOrElse("No changelog provided.")
    modLoaders.add("neoforge")

    def channel = providers.environmentVariable("PUBLISH_RELEASE_TYPE").getOrElse("release")
    type = channel == "alpha" ? ALPHA : channel == "beta" ? BETA : STABLE

    def baseName = providers.environmentVariable("PUBLISH_DISPLAY_NAME")
            .map { it.isBlank() ? null : it }
            .getOrElse("${rootProject.display_name} ${rootProject.mod_version} for ${rootProject.publish_series}")
    displayName = "${baseName} [NEOFORGE]"

    def mcVersions = rootProject.supported_minecraft_versions.split(',')*.trim()

    modrinth {
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        projectId = rootProject.modrinth_id
        minecraftVersions.addAll(mcVersions)
        requires("architectury-api", "resourceful-config")
    }

    curseforge {
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
        projectId = rootProject.curseforge_id
        minecraftVersions.addAll(mcVersions)
        clientRequired = true
        serverRequired = true
        requires("architectury-api", "resourceful-config")
    }
}